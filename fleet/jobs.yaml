- agent: claudia
  name: Relay code health
  schedule: 10 8-22 * * *
  runs_on: server
  script: relay_code_health.py
  model: none (script output is the message)
  deliver: telegram
  paused: false
- agent: claudia
  name: Morning check-in
  schedule: 30 8 * * 1-5
  runs_on: server
  script: check_in_context.py
  model: default
  deliver: telegram
  paused: false
  prompt: 'Morning check-in. In 1-2 lines recap yesterday (plan vs done from journal.md; if nothing was logged,
    say so kindly). Suggest the 3 most valuable things to work on today, drawn from Prospect Finder (businesses
    to contact) and Code Health (urgent fixes). End by asking the founder to reply ''plan: ...'' with their 1-3
    things for today. Follow the "Accountability partner" section of SOUL.md. Use only the injected context and
    files; name the source for every suggestion. Update journal.md first if needed. ORDER MATTERS: only your final
    message is delivered, so make it the complete check-in (max 10 lines, no headings, no working notes) ending
    with one question.'
- agent: claudia
  name: Evening check-in
  schedule: 0 17 * * 1-4
  runs_on: server
  script: check_in_context.py
  model: default
  deliver: telegram
  paused: false
  prompt: 'Evening check-in. Read today''s Plan in journal.md. If there is one, list it and ask what got done (reply
    ''done: ...''); if there is none, ask what they worked on today. Follow the "Accountability partner" section
    of SOUL.md. Use only the injected context and files; name the source for every suggestion. Update journal.md
    first if needed. ORDER MATTERS: only your final message is delivered, so make it the complete check-in (max
    10 lines, no headings, no working notes) ending with one question.'
- agent: claudia
  name: Friday weekly review
  schedule: 30 16 * * 5
  runs_on: server
  script: check_in_context.py
  model: default
  deliver: telegram
  paused: false
  prompt: 'Friday weekly review. From journal.md (the last 7 days), Prospect Finder and Code Health: 1) wins this
    week, 2) what was planned but not done and the likely reason, 3) one pattern you noticed, 4) the 3 priorities
    you suggest for next week. Ask what got done today (reply ''done: ...'') and whether they agree with next week''s
    priorities. This one may be up to 15 lines. Follow the "Accountability partner" section of SOUL.md. Use only
    the injected context and files; name the source for every suggestion. Update journal.md first if needed. ORDER
    MATTERS: only your final message is delivered, so make it the complete check-in (max 10 lines, no headings,
    no working notes) ending with one question.'
- agent: claudia
  name: Weekly automation pick
  schedule: 30 16 * * 0
  runs_on: server
  script: check_in_context.py
  model: default
  deliver: telegram
  paused: false
  prompt: 'Weekly automation pick. Read task-inbox.md. If it has no open items, reply exactly [SILENT]. Otherwise
    pick the ONE open task that would save the most time per week for the least build effort, and give: why it wins,
    the steps it involves today, how it would be automated (which existing agent or a new job; script-only where
    possible to save tokens), rough effort, and what you need from the founder. Mark it ''planned'' in task-inbox.md
    only after the founder says yes. Ask: ''Should I set it up?'' Follow the "Accountability partner" section of
    SOUL.md. Use only the injected context and files; name the source for every suggestion. Update journal.md first
    if needed. ORDER MATTERS: only your final message is delivered, so make it the complete check-in (max 10 lines,
    no headings, no working notes) ending with one question.'
