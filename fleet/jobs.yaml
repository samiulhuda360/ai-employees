- agent: claudia
  name: Weekly agent tune-up
  schedule: 30 17 * * 0
  runs_on: server
  script: tuneup_collector.py
  model: default
  deliver: telegram
  paused: false
  prompt: "Run the weekly agent tune-up. The injected evidence shows, for each tunable agent, what the founder approved,\
    \ finished, rejected and parked in Hermes HQ over the last 21 days (with their notes), how many ideas they left\
    \ undecided, what the fleet teacher learned for that agent, the rules already approved, and past proposals.\
    \ Propose changes to how an agent works ONLY where the evidence shows a clear pattern: at least three decisions\
    \ pointing the same way, or a VERIFIED or DEMONSTRATED learning the agent is not yet using. At most two proposals\
    \ per agent and six in total; fewer is better; none is a valid answer. Each proposal is one imperative rule\
    \ the agent can follow on its next run, under 35 words, concrete (name the thing to do or stop doing), and not\
    \ a repeat of an approved rule or past proposal. Never propose anything that contacts customers, publishes,\
    \ spends money or loosens a safety rule. Output exactly this shape and nothing before it:\n\nTUNE-UP PROPOSALS\
    \ - <YYYY-MM-DD>\n\n1. [<agent id>] RULE: <the rule>\n   Why: <the evidence in one sentence, with counts or\
    \ the learning title and date>\n\nAfter the list, one plain line per agent with no proposal, saying why (for\
    \ example: not enough decisions yet). End with this line: Approve or reject each one in Hermes HQ, on that agent's\
    \ Priority tab. Nothing changes until you approve."
- agent: opportunity-scout
  name: Daily cash builds
  schedule: 0 8 * * *
  runs_on: server
  script: cash_signal_collector.py
  model: default
  deliver: chat:opportunity-scout
  paused: false
  prompt: 'Run today''s Cash Builds report. Follow SOUL.md exactly: read cash-config.yaml, start from the injected
    collector output (shortlists paying, asking and proof, wordpress_gaps, assets), verify the top leads live (open
    the thread, read the replies, check the competitor pricing page or plugin reviews), score each with the four
    questions, and deliver the daily report in the exact shape given in SOUL.md: up to three cash builds, one SELL
    WHAT YOU HAVE line, WATCH and REJECTED. Every number needs a URL you opened. ASCII only. Read the pipeline ledger
    first and append today''s picks to it.'
- agent: opportunity-scout
  name: Fast-growth signal pulse
  schedule: 0 21 * * *
  runs_on: server
  script: null
  model: default
  deliver: chat:opportunity-scout
  paused: true
  prompt: 'Check for fast-moving opportunity signals since the last pulse. Look for newly surfaced proof that someone
    pays for a job an AI-native product could do better: a launch with real traction, a founder revenue report,
    a listing or closed deal, a pricing change, or a model or API release that makes a previously impossible workflow
    viable. Report at most one candidate worth acting on, with its evidence and AI wedge. If nothing material changed,
    say so in two lines and stop - do not manufacture sparks to fill the report. Follow SOUL.md exactly and read
    scout-config.yaml for build appetite and revenue targets. Read the decision ledger at opportunity_pipeline.md
    first; it records ideas, not postures - a past kill or microtool-only decision applies only to that named idea
    and expires after 30 days. Lead with the best opportunity found; never open by declining to recommend something.
    Most of the report belongs to lane 1: AI-native SaaS in any vertical. Mark self-reported revenue and listing
    claims as unverified. Never invent revenue, pricing, or customer counts. Give at least two direct dated source
    URLs per serious candidate. Use ASCII-safe output. Do not implement anything.'
- agent: opportunity-scout
  name: 'Weekly: build this one'
  schedule: 0 10 * * 1
  runs_on: server
  script: cash_signal_collector.py
  model: default
  deliver: chat:opportunity-scout
  paused: false
  prompt: 'Produce this week''s BUILD THIS ONE as specified in SOUL.md: synthesise the last seven daily Cash Builds
    reports and the pipeline ledger, pick exactly one build inside the limits in cash-config.yaml, and give the
    ask with its evidence, the exact deliverable (pages, inputs, outputs), a day-by-day plan inside the build limit,
    the sales page outline (headline, three bullets, price), the launch list of ten places or people in order, what
    must not be built in version 1, and the day-30 kill rule. Open with the BUILD THIS ONE line exactly as specified.
    ASCII only.'
- agent: opportunity-scout
  name: Marketplace commercial signal scan
  schedule: 0 11 * * 2,4,6
  runs_on: server
  script: null
  model: default
  deliver: chat:opportunity-scout
  paused: true
  prompt: 'Scan acquisition marketplaces for commercial proof. Read Empire Flippers listings, Flippa SaaS listings
    and closed deals, Acquire and SideProjectors. Extract category-level patterns: what job is being paid for, price
    points, MRR and margin ranges, multiples, acquisition channel, operational burden, and the weaknesses sellers
    disclose. Then identify which of those paid jobs an AI-native build would do materially better, and which are
    already well served and should be left alone. Never clone a listing, contact a seller, reveal gated details,
    make an offer, or buy anything. Treat every listing figure as seller-supplied until corroborated and say so
    explicitly. Return at most one recommended opportunity with full evidence, plus the category patterns that support
    it. Follow SOUL.md exactly and read scout-config.yaml for build appetite and revenue targets. Read the decision
    ledger at opportunity_pipeline.md first; it records ideas, not postures - a past kill or microtool-only decision
    applies only to that named idea and expires after 30 days. Lead with the best opportunity found; never open
    by declining to recommend something. Most of the report belongs to lane 1: AI-native SaaS in any vertical. Mark
    self-reported revenue and listing claims as unverified. Never invent revenue, pricing, or customer counts. Give
    at least two direct dated source URLs per serious candidate. Use ASCII-safe output. Do not implement anything.'
- agent: growth-scout
  name: Daily Fernway growth radar
  schedule: 30 8 * * *
  runs_on: server
  script: growth_signal_collector.py
  model: default
  deliver: chat:growth-scout
  paused: false
  prompt: Run the Fernway daily product and growth radar now. Read ~/agents/growth-scout/product-dossier.md and
    follow SOUL.md exactly. Use the injected public signal data as leads, then perform current web research across
    official Google/GBP sources, competitor releases, practitioner communities, review sites, YouTube, X, LinkedIn,
    Reddit, and Local Search Forum where accessible. Check every idea against existing Fernway capabilities. Find
    product quick wins, growth/conversion improvements, content opportunities, social signals, and reliability implications.
    Return the required decision-first daily report with no more than one primary recommendation and two runner-ups.
    Cite direct dated URLs, distinguish fact from inference, reject weak or duplicate ideas, and do not implement
    anything.
- agent: growth-scout
  name: Weekly Fernway product strategy
  schedule: 0 14 * * 5
  runs_on: server
  script: weekly_growth_digest.py
  model: default
  deliver: chat:growth-scout
  paused: false
  prompt: Create the weekly Fernway product strategy brief from the collected daily reports. Read ~/agents/growth-scout/product-dossier.md
    and follow the weekly brief rules in SOUL.md. Deduplicate repeated ideas and weight newer, primary, and independently
    corroborated evidence more heavily. Select exactly one quick win to ship, one experiment to validate, one content
    or original-data asset to publish, one reliability issue to address, and one larger bet to keep, change, or
    reject. Include a seven-day execution plan, metrics, dependencies, risks, and evidence that would reverse each
    decision. Preserve direct URLs and distinguish facts from inference. Do not implement changes.
- agent: blog-planner
  name: Daily blog ideas
  schedule: 0 9 * * *
  runs_on: server
  script: content_signal_collector.py
  model: default
  deliver: local
  paused: false
  prompt: 'Produce today''s Fernway blog idea batch. Follow SOUL.md exactly: use the injected collector JSON, give
    3-4 Tier A ideas you checked against the live top 10 with web search and dr_check.py, plus 8-12 Tier B quick
    leads, in the required format. Recommend only; never write the article and never publish anything. Update content-ledger.md
    and content-pipeline.md. Output only the batch, no working notes. ORDER MATTERS: only your final message is
    delivered. Do every file update first, then make your final message the complete idea list in full. Never end
    with a status line like done or list above.'
- agent: blog-planner
  name: Blog ideas fact check
  schedule: 30 9 * * *
  runs_on: server
  script: blog_draft_for_review.py
  model: default
  deliver: local
  paused: false
  prompt: 'You are the fact checker. The injected text contains the evidence the drafting model was given (under
    "Script Output") and its draft (the last "## Response"). If it starts with NO_DRAFT, reply exactly [SILENT].
    Otherwise check every number, date, duration, source, URL, DR value, quote and Fernway capability in the draft.
    A claim must be supported by the evidence, by a page you open with web search, or by proof_points. Fix what
    you can verify, delete what you cannot, never add new unsourced claims. Mandatory checks: (1) every sentence
    that says what Fernway does, tracks or offers - including every "If asked what tool" line - must match a proof_points
    entry word for word in meaning; otherwise replace it with the closest real proof point or delete it; (2) never
    let a post imply the founder or Fernway was personally involved in someone else''s case; (3) a single forum
    thread is one report, never a trend; (4) the date in the heading line must be the date printed in the evidence
    header (the run date), not a later day. Keep the exact format and ordering. Output ONLY the corrected list,
    starting with its heading line, and end with one line: "Fact check: <n> changes (<short list of what changed>)".
    No working notes before the list. The heading line is BLOG IDEAS.'
- agent: social-planner
