  model: default
  deliver: telegram
  paused: false
  prompt: 'Run the monthly fleet review. Follow the "North star, quiet hours and records" section of SOUL.md. The
    injected snapshot covers 30 days plus this month''s weekly records. FIRST write ~/agents/chief-assistant/records/monthly-<YYYY-MM
    of the month just ended>.md: per agent, its weekly scores across the month and the trend (improving / flat /
    worse); the fleet''s biggest wins and failures; the north-star numbers month over month (paying clients, MRR)
    as far as the founder has reported them; job-reliability (runs that failed or used the fallback model); and
    the three changes that would most help Fernway client growth next month. THEN send a Telegram message in clean
    bullets, max 15 lines, summarising it and asking for this month''s client count and MRR if they are missing.
    Do not apply any change. Output only the finished message. SCORING RULES: judge each agent by the quality and
    usefulness of its OWN output, not by the problems it reports. An agent that correctly finds problems (Code Health
    finding exposed keys, Client Wins finding at-risk customers) is USEFUL. BROKEN means its jobs failed or its
    output was unusable. When you cite a problem an agent found, put it under ''Needs attention first'' as the problem,
    not as the agent''s score.'
