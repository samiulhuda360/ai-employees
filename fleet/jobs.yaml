  name: Relay blog ideas
  schedule: 45 9 * * *
  runs_on: server
  script: relay_blog_ideas.py
  model: none (script output is the message)
  deliver: telegram
  paused: false
- agent: claudia
  name: Relay social ideas
  schedule: 15 11 * * *
