# Every scheduled job in the fleet: who runs it, when (cron, local time), the script whose output is
# injected into the prompt, and where the result goes. 'model: none' jobs run the script alone and
# send its output as the message, so they cost no model tokens (relays, the guardian).

jobs:
- agent: claudia
  name: Daily fleet report
  schedule: 0 9 * * *
  runs_on: server
  script: fleet_status_collector.py
  model: default
  deliver: telegram
  paused: false
  prompt: 'Write the daily fleet report for the founder on Telegram. Follow SOUL.md sections 1 and 2. The injected
    fleet status snapshot covers the last 24 hours; open the full report files it lists when you need detail. Order:
    first anything broken or needing the founder''s decision (failed or missed runs, errors, unusually short reports),
    then one short line per agent with its headline finding and the report link or name, then anything new in the
    ledgers. YouTube Watcher runs on the founder''s PC; if its reports are missing here, say they have not synced
    rather than calling it broken. Keep it under about 200 words. Always send a message, even on a quiet day: never
    reply [SILENT]. If nothing important happened, send two lines confirming each agent is healthy and what runs
    next, so the founder knows the fleet is alive. Do not change, run, or pause anything in this job; only report.
    Output only the finished Telegram message: no working notes, no reasoning, no drafts, and never the same summary
    twice. The fallback-provider notice line is added automatically; do not repeat or discuss it.'
- agent: claudia
  name: Weekly agent audit
  schedule: 0 17 * * 0
  runs_on: server
  script: fleet_weekly_collector.py
  model: default
  deliver: telegram
  paused: false
  prompt: 'Run the weekly agent audit. Follow SOUL.md section 3 and the "North star, quiet hours and records" section.
    The injected snapshot covers the last 7 days, including every report headline. Read each agent''s SOUL.md and
    relevant full reports before judging. FIRST write the record file ~/agents/chief-assistant/records/weekly-<ISO
    year>-W<ISO week>.md: a table scoring every agent useful / weak / broken with one line of evidence each (reports
    and dates), the gaps found (repeated failures, stuck verdicts, data marked unknown, stale ledgers, thin output,
    output that never changed a decision), what changed since last week''s record, and the north-star numbers (paying
    Fernway clients, MRR) if the founder has given them. THEN send the Telegram message in clean bullets: the scorecard
    in one line per agent, then at most three improvements ranked by expected benefit toward more Fernway clients,
    each with the agent, the evidence, the exact change, and how the founder will know it worked. End by asking
    which proposals to apply. Do not apply any change in this job. Output only the finished Telegram message: no
    working notes, never the same summary twice. The fallback-provider notice line is added automatically; do not
    discuss it. SCORING RULES: judge each agent by the quality and usefulness of its OWN output, not by the problems
    it reports. An agent that correctly finds problems (Code Health finding exposed keys, Client Wins finding at-risk
    customers) is USEFUL. BROKEN means its jobs failed or its output was unusable. When you cite a problem an agent
    found, put it under ''Needs attention first'' as the problem, not as the agent''s score.'
