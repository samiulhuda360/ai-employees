- agent: youtube-watcher
  name: Daily YouTube learning run
  schedule: 30 20 * * *
  runs_on: pc
  script: youtube_signal_collector.py
  model: default
  deliver: chat:youtube-watcher
  paused: false
  prompt: 'Run the daily YouTube learning pass now. Follow SOUL.md exactly. First read <project>\youtube-watcher\knowledge-base.md
    so you do not re-learn what is already recorded. The injected collector output is a ranked shortlist of new
    videos - it is leads, not findings. Pick at most five videos worth real attention, preferring demos, builds,
    postmortems, benchmarks, and teardowns over reaction and list content. For each one, fetch the transcript with:
    uv run python ''<project>\youtube-watcher\transcribe_video.py'' <VIDEO_URL> --timestamps before forming any
    opinion. Never judge a video you have not transcribed; mark it NOT WATCHED instead. Extract applicable learnings
    across AI agents, agent tooling, SaaS ideas, techniques, SEO, and local SEO/GBP. Label every kept item DEMONSTRATED,
    CLAIMED, or VERIFIED, cite timestamps, note creator incentives, and flag anything that depends on a model, API,
    or Google behavior that may have changed. Score each candidate and return the decision-first daily report defined
    in SOUL.md. Append only qualifying ADOPT or TEST entries to <project>\youtube-watcher\knowledge-base.md, and
    report exactly what was saved. Do not modify product code or implement recommendations.'
- agent: youtube-watcher
  name: Weekly YouTube learning brief
  schedule: 0 13 * * 5
  runs_on: pc
  script: weekly_learning_digest.py
  model: default
  deliver: chat:chief-assistant
  paused: true
  prompt: Create the weekly YouTube learning brief from the collected daily reports. Follow the weekly brief rules
    in SOUL.md and read <project>\youtube-watcher\knowledge-base.md first. Deduplicate hard against the daily reports
    rather than restating them, and weight demonstrated and independently corroborated findings above claimed ones.
    Select exactly one technique to adopt with a first implementation step, one technique to test with its success
    criterion, one belief to update with what changed it, one tool or model worth trying and what it would replace,
    and one thing to stop doing or tracking. For each, state what evidence would reverse the call. Trace repeated
    ideas back to their origin so three reactions to one announcement are not counted as three sources.
- agent: code-health
