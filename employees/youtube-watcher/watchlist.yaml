# Titles matching these are ranked down hard - low-substance formats.
demote_patterns:
  - "reaction"
  - "is dead"
  - "shocked"
  - "insane"
  - "you won't believe"
  - "top 10 ai tools"
  - "make $"
  - "in 60 seconds"
  - "#shorts"

# Searches the agent runs itself when the feeds are thin. Not fetched by the
# collector - they are handed to the agent as leads.
search_leads:
  - site:youtube.com agent evaluation harness walkthrough
  - site:youtube.com coding agent subagents workflow
  - site:youtube.com mcp server build tutorial
  - site:youtube.com local seo google business profile 2026 test
  - site:youtube.com ai overviews ranking study
  - site:youtube.com micro saas teardown pricing
