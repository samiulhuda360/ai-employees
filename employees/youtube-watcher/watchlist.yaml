# YouTube Watcher - channel watchlist
#
# Edit this file to change what the agent watches. Nothing else needs to change.
#
# Adding a channel:
#   - Easiest: add `handle: SomeHandle` (the @name from the channel URL) and
#     leave `id` blank. The collector resolves it on the next run and caches
#     the result in knowledge/channel_ids.json.
#   - Most reliable: paste the UC... channel id into `id`. Handles change;
#     channel ids do not.
#
# Every channel id below was resolved live on 2026-09-21 and the `name` is the
# title YouTube returned at that time. If a channel is renamed or sold, the id
# still points at the same channel - check the name in the collector output.
#
# tier 1 = mine every run. tier 2 = only surfaces when a lane keyword hits.

version: 1

defaults:
  lookback_days: 3          # how far back a video counts as "new"
  max_candidates: 25        # cap on the ranked shortlist handed to the agent
  per_channel_limit: 6      # newest N entries read per channel feed
  resolve_timeout_seconds: 20

